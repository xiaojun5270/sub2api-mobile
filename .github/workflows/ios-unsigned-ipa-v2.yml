name: Build Unsigned SwiftUI IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-unsigned-ipa-v2.yml"

concurrency:
  group: unsigned-swiftui-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_26_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort | tail -n 1)"
          if [ -n "$XCODE_26_PATH" ]; then
            sudo xcode-select -s "$XCODE_26_PATH"
          fi

          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode 26 or newer is required for Liquid Glass."
            find /Applications -maxdepth 1 -name 'Xcode*.app' -type d -print
            exit 1
          fi

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Inspect project
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          xcodebuild \
            -project ios-native/Sub2API.xcodeproj \
            -scheme Sub2API \
            -list | tee artifacts/diagnostics/xcodebuild-project.txt

      - name: Build unsigned SwiftUI app
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project ios-native/Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/SwiftUIDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build 2>&1 | tee artifacts/diagnostics/xcodebuild.log
          XCODEBUILD_EXIT="${PIPESTATUS[0]}"
          set -e

          find build/SwiftUIDerivedData -maxdepth 8 -path "*/Build/Products/*" -print \
            > artifacts/diagnostics/build-products.txt || true
          exit "$XCODEBUILD_EXIT"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/SwiftUIDerivedData -path '*/Build/Products/Release-iphoneos/Sub2API.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Sub2API.app was not found in the Release device products."
            exit 1
          fi

          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/Sub2API.app
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent Payload sub2api-swiftui-unsigned.ipa
          )

          shasum -a 256 artifacts/sub2api-swiftui-unsigned.ipa \
            | tee artifacts/sub2api-swiftui-unsigned.ipa.sha256

      - name: Upload unsigned SwiftUI IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-swiftui-unsigned-ipa
          path: |
            artifacts/sub2api-swiftui-unsigned.ipa
            artifacts/sub2api-swiftui-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-swiftui-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: ignore
          retention-days: 14
