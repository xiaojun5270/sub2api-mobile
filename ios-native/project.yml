name: Sub2API
options:
  bundleIdPrefix: com.ppx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  Sub2API:
    type: application
    platform: iOS
    sources:
      - path: Sub2API/Sub2APIApp.swift
      - path: Sub2API/Core
      - path: Sub2API/UI
      - path: Sub2API/Features
    resources:
      - path: Sub2API/Assets.xcassets
      - path: Sub2API/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ppx.sub2apimobile
        INFOPLIST_FILE: Sub2API/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
